name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript toolchain
        run: |
          pnpm exec tsc --version
          pnpm exec tsc6 --version

      - name: Check documentation links
        run: pnpm docs:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check release scripts
        run: |
          bash -n deploy/build.sh
          bash -n deploy/publish.sh

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit:run

      - name: Build
        run: pnpm build

      - name: Verify PWA artifacts
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-512.png

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
