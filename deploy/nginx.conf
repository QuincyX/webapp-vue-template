# Static hosting for Orbit (Vue Router history mode).
# Copy the contents of dist/ to /usr/share/nginx/html before enabling this file.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Vite assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: let Vue Router handle deep links and 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
