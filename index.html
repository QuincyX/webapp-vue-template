<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Orbit 是一个基于 Vue 3、Vite、TypeScript、Pinia、Axios 与 vue-i18n 的现代化前端工程示例。"
    />
    <meta name="theme-color" content="#f6f5f1" />
    <!-- iOS ignores the manifest icons, so the PNG below and these flags are required. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Orbit</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash of the wrong color scheme.
      ;(() => {
        try {
          const mode = localStorage.getItem('orbit.theme.v1')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const isDark = mode === 'dark' || ((!mode || mode === 'system') && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
        } catch {
          // Storage and matchMedia may be unavailable in hardened browser contexts.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">请启用 JavaScript 以使用 Orbit 工作台。</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
